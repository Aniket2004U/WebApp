<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weekly To-Do</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <h1>Weekly To-Do</h1>
        <p class="tagline">Plan your week, one day at a time.</p>
      </div>
      <div class="week-controls">
        <button id="prev-week" class="btn btn-secondary">&larr; Previous week</button>
        <button id="this-week" class="btn">This week</button>
        <button id="next-week" class="btn btn-secondary">Next week &rarr;</button>
      </div>
    </header>

    <section class="week-header">
      <p id="week-label" class="week-label"></p>
    </section>

    <main>
      <section id="days-grid" class="days-grid">
        <!-- Monday -->
        <article class="day-column" data-day-index="0">
          <header class="day-header">
            <div class="day-name">Monday</div>
            <div class="day-date" data-role="date-label"></div>
          </header>
          <ul class="task-list"></ul>
          <form class="task-form">
            <input type="text" class="task-input" placeholder="Add a task for Monday..." aria-label="Add Monday task" />
            <button type="submit" class="btn btn-small">Add</button>
          </form>
        </article>

        <!-- Tuesday -->
        <article class="day-column" data-day-index="1">
          <header class="day-header">
            <div class="day-name">Tuesday</div>
            <div class="day-date" data-role="date-label"></div>
          </header>
          <ul class="task-list"></ul>
          <form class="task-form">
            <input type="text" class="task-input" placeholder="Add a task for Tuesday..." aria-label="Add Tuesday task" />
            <button type="submit" class="btn btn-small">Add</button>
          </form>
        </article>

        <!-- Wednesday -->
        <article class="day-column" data-day-index="2">
          <header class="day-header">
            <div class="day-name">Wednesday</div>
            <div class="day-date" data-role="date-label"></div>
          </header>
          <ul class="task-list"></ul>
          <form class="task-form">
            <input type="text" class="task-input" placeholder="Add a task for Wednesday..." aria-label="Add Wednesday task" />
            <button type="submit" class="btn btn-small">Add</button>
          </form>
        </article>

        <!-- Thursday -->
        <article class="day-column" data-day-index="3">
          <header class="day-header">
            <div class="day-name">Thursday</div>
            <div class="day-date" data-role="date-label"></div>
          </header>
          <ul class="task-list"></ul>
          <form class="task-form">
            <input type="text" class="task-input" placeholder="Add a task for Thursday..." aria-label="Add Thursday task" />
            <button type="submit" class="btn btn-small">Add</button>
          </form>
        </article>

        <!-- Friday -->
        <article class="day-column" data-day-index="4">
          <header class="day-header">
            <div class="day-name">Friday</div>
            <div class="day-date" data-role="date-label"></div>
          </header>
          <ul class="task-list"></ul>
          <form class="task-form">
            <input type="text" class="task-input" placeholder="Add a task for Friday..." aria-label="Add Friday task" />
            <button type="submit" class="btn btn-small">Add</button>
          </form>
        </article>

        <!-- Saturday -->
        <article class="day-column" data-day-index="5">
          <header class="day-header">
            <div class="day-name">Saturday</div>
            <div class="day-date" data-role="date-label"></div>
          </header>
          <ul class="task-list"></ul>
          <form class="task-form">
            <input type="text" class="task-input" placeholder="Add a task for Saturday..." aria-label="Add Saturday task" />
            <button type="submit" class="btn btn-small">Add</button>
          </form>
        </article>

        <!-- Sunday -->
        <article class="day-column" data-day-index="6">
          <header class="day-header">
            <div class="day-name">Sunday</div>
            <div class="day-date" data-role="date-label"></div>
          </header>
          <ul class="task-list"></ul>
          <form class="task-form">
            <input type="text" class="task-input" placeholder="Add a task for Sunday..." aria-label="Add Sunday task" />
            <button type="submit" class="btn btn-small">Add</button>
          </form>
        </article>
      </section>
    </main>

    <footer class="footer">
      <small>Stored locally in your browser &middot; You can safely use this with GitHub Pages.</small>
    </footer>
  </div>

  <script src="scripts/app.js"></script>
</body>
</html>
